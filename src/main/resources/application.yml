# Classroom local PostgreSQL (a laptop default, not a production secret).
# Start it with `docker compose up -d` or use a local install; see README.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/css
    username: css
    password: css
  # Boot's own error page: never show a stack trace, exception text or binding dump.
  web:
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
      include-exception: false
